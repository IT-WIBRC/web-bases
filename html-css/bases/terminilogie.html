        <title>Terminology HTML ET CSS</title>

    <body>
        <!--
    Terminology for HTML and CSS:

1. HTML (HyperText Markup Language): C'est le langage de balisage utilisé pour structurer le contenu d'une page web. Il utilise des balises pour définir les éléments de la page, tels que les titres, les paragraphes, les images, les liens, etc.

2. CSS (Cascading Style Sheets): C'est le langage de style utilisé pour décrire la présentation d'une page web. Il permet de contrôler l'apparence des éléments HTML, tels que les couleurs, les polices, les marges, les alignements, etc.

3. Balise (Tag): C'est un élément de base en HTML qui est utilisé pour définir la structure et le contenu d'une page web. Les balises sont généralement entourées de chevrons (< >) et peuvent être auto-fermantes ou avoir une balise de fermeture correspondante.

4. Sélecteur (Selector): En CSS, un sélecteur est utilisé pour cibler les éléments HTML auxquels les styles doivent être appliqués. Il peut être basé sur le nom de la balise, la classe, l'identifiant, ou d'autres attributs.

5. Propriété (Property): En CSS, une propriété est une caractéristique d'un élément HTML que vous souhaitez styliser, comme la couleur, la taille de la police, les marges, etc.

6. Valeur (Value): En CSS, une valeur est l'attribut que vous attribuez à une propriété pour définir son apparence. Par exemple, pour la propriété "color", la valeur pourrait être "red" ou "#ff0000".

7. Box Model: C'est un concept en CSS qui décrit la structure d'un élément HTML en termes de contenu, de padding, de bordure et de marge. Il est essentiel pour comprendre comment les éléments sont espacés et alignés sur une page web.

8. Responsive Design: C'est une approche de conception web qui vise à créer des sites web qui s'adaptent et fonctionnent bien sur une variété d'appareils et de tailles d'écran, en utilisant des techniques telles que les media queries en CSS.

9. Flexbox: C'est un module de mise en page en CSS qui permet de créer des mises en page flexibles et réactives. Il facilite l'alignement et la distribution des éléments dans un conteneur, même lorsque leur taille est inconnue ou dynamique.

10. Grid Layout: C'est un autre module de mise en page en CSS qui permet de créer des mises en page en deux dimensions. Il offre une grille de lignes et de colonnes pour organiser les éléments de manière plus complexe que Flexbox.

11. pseudo-classes: En CSS, les pseudo-classes sont utilisées pour définir un état spécial d'un élément, comme :hover (lorsque la souris survole un élément) ou :nth-child (pour cibler des éléments spécifiques dans une liste).

12. Attributs: En HTML, les attributs sont des informations supplémentaires que vous pouvez ajouter à une balise pour fournir des détails sur l'élément, comme l'attribut "src" pour les images ou "href" pour les liens.

13. Transition: En CSS, une transition permet de créer des effets d'animation en douceur lorsque les propriétés d'un élément changent, comme la couleur ou la position.

14. Animation: En CSS, une animation est une séquence d'effets visuels qui peuvent être appliqués à un élément pour créer des mouvements ou des transformations plus complexes que les transitions.

15. Media Queries: En CSS, les media queries sont utilisées pour appliquer des styles spécifiques en fonction des caractéristiques de l'appareil, comme la largeur de l'écran, la résolution, ou l'orientation.

16. Anchor (Lien): En HTML, un anchor est un élément qui permet de créer des liens vers d'autres pages web ou des sections spécifiques d'une page. Il est généralement défini avec la balise <a>.

17. Div: En HTML, une div est un conteneur générique utilisé pour regrouper des éléments et appliquer des styles ou des scripts à ces éléments. Elle est définie avec la balise <div>.

18. Class: En HTML, une classe est un attribut qui peut être ajouté à une balise pour identifier un groupe d'éléments similaires. En CSS, les classes sont utilisées comme sélecteurs pour appliquer des styles à ces éléments.

19. ID: En HTML, un ID est un attribut unique qui peut être ajouté à une balise pour identifier un élément spécifique sur la page. En CSS, les ID sont utilisés comme sélecteurs pour appliquer des styles à cet élément particulier.

20. Semantic HTML: C'est une pratique de développement web qui consiste à utiliser des balises HTML de manière significative pour décrire le contenu de la page, plutôt que d'utiliser des balises génériques comme <div> pour tout. Par exemple, utiliser <header> pour l'en-tête, <nav> pour la navigation, <article> pour un article de blog, etc.

21. Accessibility (Accessibilité): C'est la pratique de rendre les sites web utilisables par tous, y compris les personnes ayant des handicaps. Cela inclut l'utilisation de balises sémantiques, l'ajout de descriptions alternatives pour les images, et la garantie que le site est navigable au clavier.

22. Nesting (Imbrication): En HTML, l'imbrication fait référence à la pratique de placer des éléments à l'intérieur d'autres éléments. Par exemple, un paragraphe (<p>) peut être imbriqué à l'intérieur d'une div (<div>), et une liste (<ul>) peut être imbriquée à l'intérieur d'un article (<article>).

23. Parent et element enfant: En HTML, un élément parent est un élément qui contient un ou plusieurs éléments enfants. Par exemple, dans la structure <div><p>Texte</p></div>, la div est le parent du paragraphe, et le paragraphe est l'enfant de la div.

24. Inheritance (Héritage): En CSS, l'héritage est un concept selon lequel certaines propriétés de style sont automatiquement transmises des éléments parents aux éléments enfants. Par exemple, si vous définissez la couleur du texte sur un élément parent, les éléments enfants hériteront de cette couleur à moins qu'ils ne soient spécifiquement stylisés pour avoir une couleur différente.

25. Specificity (Spécificité): En CSS, la spécificité est un système de calcul qui détermine quelle règle de style s'applique à un élément lorsque plusieurs règles ciblent le même élément. Les règles avec une spécificité plus élevée prennent le pas sur celles avec une spécificité plus faible.

26. Priorité des styles: En CSS, la priorité des styles est déterminée par la spécificité des sélecteurs, l'ordre dans lequel les règles sont définies, et l'utilisation de !important. Les règles avec une spécificité plus élevée ou marquées comme !important auront la priorité sur les autres règles.

27. Formulaire: En HTML, un formulaire est un élément qui permet aux utilisateurs de saisir des données et de les envoyer à un serveur pour traitement. Il est défini avec la balise <form> et peut contenir divers éléments de formulaire tels que des champs de texte, des cases à cocher, des boutons radio, etc.

28. Pseudo-éléments: En CSS, les pseudo-éléments sont utilisés pour styliser des parties spécifiques d'un élément, comme ::before et ::after, qui permettent d'ajouter du contenu avant ou après le contenu principal d'un élément.

29. Label: En HTML, un label est un élément qui fournit une étiquette descriptive pour un élément de formulaire, améliorant ainsi l'accessibilité. Il est défini avec la balise <label> et peut être associé à un élément de formulaire en utilisant l'attribut "for".

30. Placeholder: En HTML, un placeholder est un texte d'exemple qui apparaît dans un champ de formulaire avant que l'utilisateur ne saisisse une valeur. Il est défini avec l'attribut "placeholder" sur les éléments de formulaire tels que les champs de texte.

31. Box sizing: En CSS, la propriété box-sizing permet de contrôler comment les dimensions d'un élément sont calculées. Avec la valeur "border-box", les dimensions incluent le contenu, le padding et la bordure, tandis qu'avec la valeur "content-box", les dimensions n'incluent que le contenu, et le padding et la bordure sont ajoutés en plus.

32. Margin: En CSS, la marge est l'espace extérieur autour d'un élément qui sépare cet élément des autres éléments. Elle est définie avec la propriété "margin" et peut être spécifiée pour les quatre côtés de l'élément (haut, droite, bas, gauche) ou de manière shorthand.

33. Padding: En CSS, le padding est l'espace intérieur entre le contenu d'un élément et sa bordure. Il est défini avec la propriété "padding" et peut également être spécifié pour les quatre côtés de l'élément.

34. Metadonnees: En HTML, les métadonnées sont des informations sur la page web qui ne sont pas affichées directement aux utilisateurs, mais qui fournissent des informations aux moteurs de recherche, aux navigateurs et aux autres services. Elles sont généralement définies dans la section <head> de la page à l'aide de balises telles que <meta>.

35. Doctype: En HTML, le doctype est une déclaration qui indique au navigateur quel type de document HTML est utilisé. Il doit être placé au début de chaque document HTML et est généralement défini comme <!DOCTYPE html> pour les documents HTML5. Et pour les documents xml, il est défini comme <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">.
