<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Git et Github terminologie</title>
    </head>

    <body>
        <script>
            // Terminologie Git et Github
            const terminologie = {
                "Repository": "Un dépôt où le code source et l'historique des modifications sont stockés.",
                "Branch": "Une branche est une version parallèle du code source, permettant de travailler sur des fonctionnalités ou des corrections sans affecter la branche principale.",
                "Commit": "Un commit est un enregistrement de modifications apportées au code source, accompagné d'un message décrivant les changements.",
                "Merge": "Le processus de fusion de deux branches pour intégrer les modifications d'une branche dans une autre.",
                "Pull Request": "Une demande de tirage est une proposition de modification qui permet aux autres développeurs de revoir et de discuter des changements avant de les intégrer dans la branche principale.",
                "Issue": "Un problème ou une tâche à résoudre, souvent utilisé pour suivre les bugs ou les améliorations dans un projet.",
                "Fork": "Une copie d'un dépôt qui permet de proposer des modifications sans affecter le dépôt original, souvent utilisée pour contribuer à des projets open source.",
                "rebase": "Une technique pour réécrire l'historique des commits, souvent utilisée pour maintenir un historique de projet propre et linéaire.",
                "Tag": "Un tag est une référence à un point spécifique dans l'historique du projet, souvent utilisé pour marquer des versions ou des releases importantes.",
                "origin": "Le nom par défaut pour le dépôt distant d'où un projet a été cloné, souvent utilisé pour faire référence au dépôt principal d'un projet.",
            };

            console.log("Terminologie Git et Github:", terminologie);
        </script>
    </body>

</html>
